name: Component tests

# develop, and the version branches changes are collected in before a release (v4.2.0 and so on).
on:
  pull_request:
    branches: [develop, 'v[0-9]*']
  push:
    branches: [develop, 'v[0-9]*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.400
      - name: Install Tailwind CLI
        run: ./install.sh
        working-directory: tools
      - name: Run .NET tests
        run: dotnet test tests/BlazorBlueprint.Tests/BlazorBlueprint.Tests.csproj --verbosity normal
